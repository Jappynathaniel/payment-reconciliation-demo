[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "registration-payment-reconciliation"
version = "0.1.0"
description = "A missed-payment-callback recovery demonstration informed by Worldline India Checkout docs"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "python-multipart>=0.0.18,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
reconcile = "reconcile.cli:main"

[tool.setuptools.packages.find]
include = ["reconcile*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
